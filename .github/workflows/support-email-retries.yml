name: Support email retries

on:
  schedule:
    # Offset from the hour to reduce peak scheduler contention (UTC).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-email-retries
  cancel-in-progress: false

jobs:
  retry:
    # Explicit opt-in; even manual runs use only reviewed default-branch code.
    if: vars.SUPPORT_EMAIL_RETRIES_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Retry due support emails
        env:
          DATABASE_URL: ${{ secrets.SUPPORT_DATABASE_URL }}
          HARNESSSYNC_EMAIL_ADDRESS: ${{ secrets.SUPPORT_EMAIL_ADDRESS }}
          HARNESSSYNC_EMAIL_APP_PASSWORD: ${{ secrets.SUPPORT_EMAIL_APP_PASSWORD }}
          HARNESSSYNC_EMAIL_TO_ADDRESS: ${{ secrets.SUPPORT_EMAIL_TO_ADDRESS }}
        run: python -m harnesssync.support_notifications --scheduled
