services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Persist the SQLite db and JSON logs across container rebuilds
      - ./climber_profiles:/app/climber_profiles
      # Secrets stay on the host; mounted read-only
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    # Without an [auth] section in secrets.toml the app refuses to start a
    # session. For local testing without sign-in, uncomment this - never on a
    # server other people can reach.
    # environment:
    #   HARNESSSYNC_DEV_MODE: "1"
    restart: unless-stopped
