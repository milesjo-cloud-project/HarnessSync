<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Mountain peak. SVG favicons honour prefers-color-scheme, so the mark
       stays legible against both a light and a dark browser tab strip. -->
  <style>
    path { fill: #14539f; }
    @media (prefers-color-scheme: dark) { path { fill: #7eb6fd; } }
  </style>
  <path d="M8 80 L36 30 L48 50 L60 22 L88 80 Z"/>
</svg>
